<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Characters counter</title>
    <link rel="stylesheet" href="01_style.css">
</head>

<body>
    <div class="container">
        <h2>Real-time Characters counter</h2>
        <textarea id="textarea" class="textarea" placeholder="please write your text here...."
            maxlength="50"></textarea>
        <div class="counter-container">
            <p>Total Characters: <span class="total-counter" id="total-counter"></span></p>
            <p> Remaining: <span class="remaining-counter" id="remaining-counter"></span></p>
        </div>
    </div>

    <script src="01.js"></script>
</body>

</html>
